<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A little wizard, deep in his work. An interactive 2D illustration made with Posecraft." />
  <title>Wwwzard at work · Posecraft</title>
  <link rel="stylesheet" href="./examples/wwzard-demo.css" />
</head>
<body>
  <header><a class="brand" href="./">Posecraft<span>Living illustrations</span></a><a class="studio-link" href="./?demo=wwzard-desk">Open in Studio <span aria-hidden="true">↗</span></a></header>
  <main>
    <div class="intro"><p class="eyebrow">A little magic, between keystrokes.</p><h1>Wwwzard at work.</h1><p>He has a thought to finish.<br>Say hello. See what happens.</p></div>
    <div class="illustration-wrap"><div id="illustration" aria-label="A faceless purple wizard working at his desk"></div></div>
    <div class="controls"><button id="hello" type="button">Say hello</button><button id="close-laptop" class="secondary" type="button">Close laptop</button><button id="open-laptop" class="secondary" type="button">Open laptop</button><button id="quiet" class="secondary" type="button">Give him a moment</button><button id="play" class="text-button" type="button" aria-pressed="false">Pause</button></div>
    <fieldset class="mood-controls"><legend>How Wwwzard feels</legend><div class="mood-buttons"><button type="button" data-mood="disappointed" aria-pressed="false">Disappointed</button><button type="button" data-mood="normal" aria-pressed="true">Normal</button><button type="button" data-mood="angry" aria-pressed="false">Angry</button></div></fieldset>
    <p id="notice" role="status" aria-live="polite">You can also tap his hat.</p>
    <p id="error" role="alert" hidden></p>
    <details id="study"><summary>Look at the animation</summary><div class="study-controls"><label>Movement<select id="clip"><option value="work">Working</option><option value="notice">Noticing</option><option value="curious">Curiosity</option><option value="greet">Greeting</option><option value="frustrated">Too many interruptions</option><option value="rest">Resting</option><option value="close">Closing the laptop</option><option value="closed-idle">Working with laptop closed</option><option value="closed-pause">Pausing with laptop closed</option><option value="open">Opening the laptop</option></select></label><label>Pose<input id="scrub" type="range" min="0" max="1" step="0.001" value="0" /></label><label>Speed<select id="study-speed"><option value="1">Normal</option><option value="0.25">Quarter speed</option></select></label><button id="study-play" class="secondary" type="button">Play movement</button><button id="live" class="secondary" type="button">Return to live scene</button></div></details>
  </main>
  <footer><span>Drawn, rigged and animated in 2D.</span><button id="save" class="text-button" type="button">Download editable scene</button><a href="./?demo=wwzard-desk">Make it your own</a></footer>
  <script type="module" src="./examples/wwzard-demo.js"></script>
</body>
</html>
